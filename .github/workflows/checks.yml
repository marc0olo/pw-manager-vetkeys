name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Everything that needs only Node. Fast, and green or red on its own merits
  # even if the toolchain job below has a bad day fetching a compiler.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  # Needs the Motoko toolchain, because it rebuilds the canister to compare the
  # committed Candid binding against what `src/backend` actually exposes.
  #
  # This is the job that matters for `src/bindings/`. Those files are generated
  # but committed — so a clone can typecheck and run the suite without a Motoko
  # toolchain — and the cost of committing generated code is that it goes stale
  # silently. Candid ignores record fields it does not know, so an *added* field
  # produces no error anywhere: the app simply never sees it.
  # Needs the Motoko toolchain, because it rebuilds the canister to compare the
  # committed Candid binding against what `src/backend` actually exposes.
  #
  # This is the job that matters for `src/bindings/`. Those files are generated
  # but committed — so a clone can typecheck and run the suite without a Motoko
  # toolchain — and the cost of committing generated code is that it goes stale
  # silently. Candid ignores record fields it does not know, so an *added* field
  # produces no error anywhere: the app simply never sees it.
  backend:
    runs-on: ubuntu-latest
    # The project's own dev image, so CI compiles with the versions this code is
    # developed against — icp-cli 1.3.0, mops 3.1.0, Node 24.15 — rather than
    # whatever `npm install -g` resolves to on the day. Pinned to a release tag
    # for the same reason.
    container: ghcr.io/dfinity/icp-dev-env-motoko:v2.0.0
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: mops check
      - run: npm run check-bindings
