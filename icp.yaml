# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.3.0/docs/schemas/icp-yaml-schema.json

canisters:
  # Holds only ciphertext: the vetKeys EncryptedMaps state plus access control.
  - name: backend
    recipe:
      type: "@dfinity/motoko@v5.1.0"
    settings:
      environment_variables:
        # The vetKD key that derives every vault key. `test_key_1` is what local
        # networks provision. IMMUTABLE once data exists — see README.
        VETKD_KEY_NAME: test_key_1

  # Serves the app. `presync` builds after canister IDs exist so the bundle is
  # produced against the deployed backend; IDs still reach the app at runtime
  # through the `ic_env` cookie.
  - name: frontend
    recipe:
      type: "@dfinity/static-site@v0.3.3"
      configuration:
        dir: dist
        presync:
          - npm ci
          - npm run build

networks:
  - name: local
    mode: managed
    # Internet Identity derives a principal per ORIGIN, and the port is part of
    # the origin. An OS-assigned port (0) would hand you a new principal — and an
    # apparently empty vault — on every restart, so the port is pinned. 8000 is
    # the icp-cli default; this project uses 8100 to coexist with other projects.
    gateway:
      port: 8100
    # Deploys the II canisters locally, served at http://id.ai.localhost:8100.
    # The app finds it from its own origin at runtime — no build configuration.
    # Required, not a toggle: anything served from a local gateway signs in
    # against local II, so with `ii: false` the sign-in popup would open nothing.
    ii: true
